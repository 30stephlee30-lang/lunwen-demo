      { label: '老师，我这周状态不太好', tag: '真诚', fx: { favor: -5, sanity: 8 }, result: '王导沉默了一下，说：「身体重要。」\n你差点哭出来。\n然后他说：「那下周多讲点。」', rw: 'advisor', re: 'normal', next: 'p5' }
    ] },
    p5: { ch: 'ch0', day: 2, scene: 'meeting', who: 'narrator', expr: 'tired', text: '组会结束。王导合上电脑，忽然转头看你：\n「你这个方向，我有一个想法。」\n所有师兄都低下了头。\n你知道，这句话的意思是：有新活了。', next: 'n6' },

    n6: { ch: 'ch1', day: 8, scene: 'office', who: 'advisor', expr: 'normal', text: '王导从抽屉里拿出一张纸，上面是一个二〇一三年的 idea。\n「这个方向我十年前就想过了，一直没时间做。你去做吧，很有前景。」\n你查了一下，这个方向的最新论文停在二〇一九年。', choices: [
      { label: '老师英明，我这就去做', tag: '听话', flag: { ideaOld: true }, fx: { favor: 8, progress: 2, sanity: -3 }, result: '王导满意地笑了。\n你后来才知道，这个方向在学术圈有个学名，叫『学术考古』。', rw: 'advisor', re: 'smug', next: 'n7' },
      { label: '老师，我想做点新的', tag: '头铁', flag: { ideaOwn: true }, fx: { favor: -6, progress: 4, sanity: -2 }, result: '王导的笑容消失了零点五秒。\n「新的东西，风险大。你确定？」\n你点了点头，手心全是汗。', rw: 'advisor', re: 'stern', next: 'n7' },
      { label: '把老师的 idea 和热点缝合一下', tag: '学术裁缝', flag: { ideaMix: true }, fx: { favor: 4, progress: 5, sanity: -4 }, result: '你在大模型后面加了一个十年前的模块。\n王导说：「有创新。」\n你知道，这叫缝合。\n但学术圈管它叫『交叉研究』。', next: 'n7' },
      { label: '回去问问师兄', tag: '稳重', fx: { sanity: 2, favor: 1 }, result: '师兄说：「选哪个都一样，反正最后都要改。」\n你问：「那选什么？」\n他说：「选好写的。」', rw: 'senior', re: 'smug', next: 'n7' }
    ] },

    n7: { ch: 'ch1', day: 10, scene: 'lab', who: 'senior', expr: 'tired', text: '师兄听完你的选题，放下保温杯。里面泡着枸杞。\n「你知道开题最重要的是什么吗？」\n「创新点？」\n「不，是让评委相信你有创新点。」', choices: [
      { label: '那怎么写？', tag: '求学', fx: { progress: 4, sanity: -1 }, result: '「把『首次』『提出』『框架』三个词用好。」\n师兄说，「论文嘛，三分做，七分写。」\n你掏出手机记了下来。', next: 'n8' },
      { label: '师兄你当年怎么过的？', fx: { sanity: 3, hair: -1 }, result: '师兄沉默了很久。\n「我当年……延毕了半年。」\n他把保温杯拧紧，「所以我现在是博五。」\n你突然不知道该安慰谁。', rw: 'senior', re: 'sad', next: 'n8' },
      { label: '我觉得还是得靠真本事', tag: '理想主义', flag: { idealist: true }, fx: { favor: 1, sanity: 2 }, result: '师兄笑了：「真本事也要包装。\n你看我，真本事，秃了。」\n你笑不出来。', rw: 'senior', re: 'smug', next: 'n8' }
    ] },

    n8: { ch: 'ch1', day: 21, scene: 'meeting', who: 'narrator', expr: 'panic', text: '开题报告会。你站在投影前，台下三位老师。\n「你这个研究的创新点是什么？」\n最中间的老师推了推眼镜。', choices: [
      { label: '首次将 A 方法应用到 B 场景', tag: '标准答案', fx: { favor: 6, progress: 5, sanity: -3 }, result: '老师们点点头。\n你学会了第一个学术黑话：「首次」。\n第二个是：「具有重要的理论意义和现实意义」。', next: 'n9' },
      { label: '工程价值比较大，能落地', tag: '实在', fx: { favor: -2, progress: 3, sanity: -1 }, result: '「工程价值也是价值。」老师说，\n「但这是学术论文。」\n你听懂了：得加个『首次』。', rw: 'advisor', re: 'stern', next: 'n9' },
      { label: '创新点在于……嗯……', tag: '卡壳', fx: { favor: -8, sanity: -8, hair: -2 }, result: '空气凝固了。\n评委小声说：「有点抽象。」\n王导替你接了一句：「创新点我们还在凝练。」\n你坐下时，腿是软的。', next: 'n9' },
      { label: '老师，这个方向是王导十年前提出的', tag: '甩锅', fx: { favor: -4, sanity: 1 }, result: '王导看了你一眼。\n那一眼，你记了三年。', rw: 'advisor', re: 'angry', next: 'n9' }
    ] },

    n9: { ch: 'ch1', day: 22, scene: 'meeting', who: 'narrator', expr: 'tired', text: '开题通过了。意见栏写着：\n「建议进一步聚焦研究问题，突出创新性。」\n你盯着『进一步』三个字，感觉它比你的论文还长。\n王导在群里发：「开题只是开始，抓紧做实验。」\n配图是一张鸡汤海报。', next: 'n10' },

    n10: { ch: 'ch2', day: 30, scene: 'lab', who: 'narrator', expr: 'tired', text: '一个月后。凌晨两点，实验室只剩下你和一台嗡嗡响的服务器。\nloss 曲线像你的人生：高位震荡，偶尔下探，然后创新低。\n很抽象，但很真实。\n你盯着屏幕，屏幕上倒映着一个发际线可疑的人。', choices: [
      { label: '调参，网格搜索，大力出奇迹', tag: '炼丹', cnt: { late: 1 }, fx: { progress: 7, sanity: -7, hair: -4 }, result: '你跑了四十七组参数。第四十八组终于收敛了。\n你怀疑是随机种子显灵，于是又跑了一遍。\n它又散了。', next: 'n11' },
      { label: '检查数据泄漏', tag: '严谨', flag: { debugged: true }, fx: { progress: 5, sanity: -3 }, result: '你发现测试集混进了训练集。\n修正后，准确率从 98% 掉到了 62%。\n这才是真实的世界。', next: 'n11' },
      { label: '换一个更强的 baseline', tag: '卷王', fx: { progress: 4, sanity: -5, hair: -2 }, result: '你换了最新的模型。\n它确实更强，强到把你的方法衬托得很朴素。', next: 'n11' },
      { label: '去问师兄', tag: '求助', flag: { seniorHelp: true }, fx: { sanity: 2, progress: 3 }, result: '师兄看了一眼：「你学习率后面少了个零。」\n你想死的心都有了。', rw: 'senior', re: 'smug', next: 'n11' }
    ] },

    n11: { ch: 'ch2', day: 38, scene: 'lab', who: 'narrator', expr: 'sad', text: '终于，结果出来了。\n但是和你的假设相反：你的方法比 baseline 差了三个点。\n导师在群里问：「实验怎么样了？」', choices: [
      { label: '如实汇报，负结果也是结果', tag: '诚实', fx: { favor: 2, sanity: -3, progress: 5 }, result: '王导回了一个「嗯」。\n你盯着这个字看了五分钟，试图从中读出情绪。\n最后你读出了：『继续』。', next: 'n12' },
      { label: '挑几组好看的，先应付一下', tag: '危险', flag: { fakeData: true }, cnt: { lie: 1 }, fx: { favor: 5, progress: 6, sanity: -4 }, result: '你挑了三次里最好的一次。\n王导很满意：「这个结果可以冲一冲。」\n你笑得很勉强。', rw: 'advisor', re: 'smug', next: 'n12' },
      { label: '重新设计实验，找出原因', tag: '科研精神', flag: { rigorous: true }, cnt: { late: 1 }, fx: { progress: 8, sanity: -6, hair: -2 }, result: '你熬了三个通宵，发现是数据预处理的问题。\n修正后，结果好了五个点。\n你第一次觉得，科研还是有希望的。', next: 'n12' },
      { label: '硬解释：这说明我们的方法更鲁棒', tag: '嘴硬', cnt: { lie: 1 }, fx: { favor: 1, progress: 2, sanity: -2 }, result: '你在周报里写：「该现象表明模型具有更强的泛化潜力。」\n王导回：「继续。」\n你学会了第二个学术黑话：『鲁棒』。', next: 'n12' }
    ] },

    n12: { ch: 'ch2', day: 45, scene: 'office', who: 'advisor', expr: 'normal', text: '王导把你叫到办公室。\n「结果我看了，还不错。能不能再加一个实验？下个月组会讲。」\n你想起自己还没开始写论文。', choices: [
      { label: '好的老师，我尽量', tag: '打工人', cnt: { late: 1 }, fx: { favor: 6, progress: 4, sanity: -6, hair: -2 }, result: '你接了。\n走出办公室时才想起来，下个月还有开题后的第一次汇报。\n你突然理解了师兄的保温杯。', next: 'n13' },
      { label: '老师，我论文还没开始写', tag: '边界感', fx: { favor: -3, sanity: 4, progress: 2 }, result: '王导皱了皱眉：「写论文不着急，实验做扎实。」\n你心想：去年他也是这么说的。', rw: 'advisor', re: 'stern', next: 'n13' },
      { label: '让师妹帮忙跑一下', tag: '传承', flag: { juniorHelp: true }, fx: { favor: 1, sanity: 2, progress: 2 }, result: '师妹很爽快地答应了：「师兄，我正好想学。」\n你突然有点愧疚。\n但只有一点。', rw: 'junior', re: 'happy', next: 'n13' },
      { label: '画饼：这个实验可以冲顶会', tag: '画饼', cnt: { lie: 1 }, fx: { favor: 7, progress: 3, sanity: -4 }, result: '王导眼睛亮了：「好！有志气！」\n你走出办公室，开始后悔。\n顶会，顶会，顶不住的会。', rw: 'advisor', re: 'happy', next: 'n13' }
    ] },

    n13: { ch: 'ch2', day: 48, scene: 'lab', who: 'junior', expr: 'happy', text: '晚上十点，实验室。\n师妹凑过来：「师兄，你那个实验能不能带带我？我想学。」\n「还有，你最近班味有点重。」\n她眼睛里有光，像三年前的你。', choices: [
      { label: '行，我教你', tag: '带人', flag: { juniorHelp: true }, fx: { sanity: 5, favor: 2, progress: -2 }, result: '你花了一个小时教她。\n她学会后说：「师兄你好厉害。」\n你笑了笑，没告诉她你也是刚学会的。', next: 'n14' },
      { label: '我现在有点忙，改天', tag: '拒绝', fx: { progress: 4, sanity: -2, favor: -1 }, result: '她说「好的」，然后自己去看文档了。\n你看着她的背影，想起自己也被拒绝过。', rw: 'junior', re: 'sad', next: 'n14' },
      { label: '你帮我把数据跑完，我教你', tag: '交易', flag: { juniorHelp: true }, fx: { progress: 5, sanity: -1 }, result: '她跑了一晚上数据。\n你教了她十分钟。\n你觉得自己越来越像师兄了。', next: 'n14' }
    ] },

    n14: { ch: 'ch2', day: 55, scene: 'lab', who: 'narrator', expr: 'tired', text: '实验终于告一段落。\n你打开 Word，准备写论文。\n光标在空白页上闪烁，像在嘲笑你。\n你突然想起，致谢还没写。', next: 'n15' },

    n15: { ch: 'ch3', day: 55, scene: 'dorm', who: 'narrator', expr: 'tired', text: '写论文的第一天。\n你整理了桌面，泡了咖啡，打开了文献管理软件。\n三个小时后，你的参考文献从十二篇变成了八十七篇，正文还是零字。', choices: [
      { label: '先写大纲，再填内容', tag: '方法论', fx: { progress: 6, sanity: -2 }, result: '你写了三级标题。\n看着目录，你产生了一种『论文已经写完了』的错觉。\n这种错觉持续了三天。', next: 'n16' },
      { label: '从致谢开始写，先感动自己', tag: '感性', fx: { sanity: 5, progress: -2 }, result: '你写了三千字致谢，从导师写到食堂阿姨。\n正文：零字。\n但你的眼眶湿了。', next: 'n16' },
      { label: '让 AI 先写一版，我再改', tag: '科技', flag: { aiUsed: true }, cnt: { ai: 1 }, fx: { progress: 8, sanity: 2 }, result: '十分钟后，你拥有了一篇结构完整、语言流畅、\n但你一个字都不信的初稿。', next: 'n16' },
      { label: '先去实验室，写作明天再说', tag: '逃避', fx: { progress: -3, sanity: 3 }, result: '你在实验室坐了一天，跑了两个无关紧要的实验。\n你觉得自己很忙。\n确实很忙，但论文还是零字。', next: 'n16' }
    ] },

    n16: { ch: 'ch3', day: 62, scene: 'dorm', who: 'narrator', expr: 'sad', text: '凌晨一点，你写到『实验结果表明』，卡住了。\n手机亮了，是妈妈：「最近怎么样？钱够不够花？」\n你看着屏幕，突然有点想哭。', choices: [
      { label: '挺好的，快写完了', tag: '报喜不报忧', cnt: { lie: 1 }, fx: { sanity: -4, favor: 1 }, result: '「那就好，别太累。」妈妈说。\n你挂了电话，盯着天花板看了很久。\n天花板上有一道裂缝，像你的论文结构。\n你想起那句话：读研哪有不疯的，硬撑罢了。', next: 'n17' },
      { label: '妈，我有点写不下去了', tag: '示弱', fx: { sanity: 8, progress: -2 }, result: '妈妈沉默了一下：\n「写不下去就回来住几天，妈给你做好吃的。」\n你哭了。\n哭完继续写。', next: 'n17' },
      { label: '发个朋友圈：科研好难', tag: '社交', fx: { sanity: 3, hair: -1 }, result: '十分钟后，导师点了个赞。\n你吓得把朋友圈设成了三天可见。', next: 'n17' },
      { label: '谁都不回，继续写', tag: '硬撑', cnt: { late: 1 }, fx: { progress: 5, sanity: -6, hair: -3 }, result: '你写到天亮。\n正文多了两千字，其中一千八百字要删。', next: 'n17' }
    ] },

    n17: { ch: 'ch3', day: 70, scene: 'corridor', who: 'senior', expr: 'tired', text: '楼下便利店，你遇到师兄。他手里拎着两罐啤酒。\n「写不出来？」\n「嗯。」\n「正常。我写论文的时候，把知网翻成了推荐算法。」', choices: [
      { label: '陪我喝一罐', fx: { sanity: 7, progress: -2, hair: -1 }, result: '你们坐在马路牙子上，从科研聊到人生。\n师兄说：「科研是份工作，别把它当命。」\n你点点头，觉得他说得对。\n然后他打了个嗝，说：「但也别不当回事。」', next: 'n17b' },
      { label: '不了，我回去改论文', fx: { progress: 4, sanity: -3 }, result: '师兄看着你的背影喊：「别熬太晚！」\n你挥了挥手，没回头。', rw: 'senior', re: 'normal', next: 'n17b' },
      { label: '师兄，你后悔读博吗？', fx: { sanity: 3 }, result: '他想了很久：「后悔。但让我再选一次，我可能还这样。」\n你突然不知道该说什么。\n风吹过来，带着烤肠的味道。', rw: 'senior', re: 'sad', next: 'n17b' }
    ] },

    n17b: { ch: 'ch3', day: 70, scene: 'night', who: 'narrator', expr: 'normal', text: '回宿舍的路上，你在便利店门口遇到一只猫。\n它蹭了蹭你的裤腿，抬头看你，眼睛很亮。', choices: [
      { label: '蹲下来撸十分钟猫', tag: '猫德', fx: { sanity: 6, progress: -1 }, result: '猫在你手心里打了个呼噜。\n你突然觉得，论文也不是非写不可。\n——当然，还是得写。', next: 'n18' },
      { label: '拍张照发师门群', tag: '分享', fx: { sanity: 3 }, result: '师妹秒回：「好可爱！」\n师兄回：「这是实验室楼下那只，它比我活得久。」\n导师没回。你松了口气。', next: 'n18' },
      { label: '狠心离开，回去写论文', tag: '自律', fx: { progress: 3, sanity: -2 }, result: '你走了两步，回头看了一眼。\n猫还坐在那里。\n你觉得自己是个坏人。', next: 'n18' }
    ] },

    n18: { ch: 'ch3', day: 78, scene: 'lab', who: 'narrator', expr: 'panic', text: '初稿完成。你数了一下，四万三千字，比本科毕业论文多了三倍。\n你把稿子发给王导。\n两天后，批注回来了：满屏红色，第一页写着「重写」。', choices: [
      { label: '逐条改，改到导师满意', tag: '听话', cnt: { late: 1 }, fx: { progress: 9, sanity: -8, hair: -4 }, result: '你改了两周。\n第三周，王导说：「还是第一版好一点。」\n你看着电脑，想把自己也重写一遍。\n你在心里默念：如何呢，又能怎。', next: 'n19' },
      { label: '先改最关键的，其他解释', tag: '性价比', fx: { progress: 6, sanity: -4, favor: 1 }, result: '你改了三章，剩下的一一回复。\n王导说：「态度不错。」\n这是你听过最像表扬的批评。', next: 'n19' },
      { label: '跟导师争一下，我觉得我没错', tag: '学术自信', flag: { argued: true }, fx: { favor: -4, sanity: 2, progress: 3 }, result: '你们争了半小时。\n最后王导说：「按你的来，出事你负责。」\n你突然有点怀念被改稿的日子。', rw: 'advisor', re: 'angry', next: 'n19' },
      { label: '摆烂，先睡一觉', tag: '躺平', fx: { sanity: 6, progress: -4 }, result: '你睡了两天。\n醒来发现导师在群里@了你三次。\n最后一次是：「还在吗？」', next: 'n19' }
    ] },

    n19: { ch: 'ch3', day: 80, scene: 'dorm', who: 'narrator', expr: 'tired', text: '改完稿，你觉得自己已经不认识这篇文章了。\n但它确实比第一版好。\n你把它命名为：\n「终稿_最终版_真的最终版_v7.docx」。', next: 'n20' },

    n20: { ch: 'ch4', day: 85, scene: 'lab', who: 'narrator', expr: 'panic', text: '查重报告出来了。\n总文字复制比：2.8%。你松了口气。\n往下翻：AIGC 检测结果 97.3%。\n你：？', choices: [
      { label: '手动改，一句一句改', tag: '老实人', flag: { aiFixed: true }, cnt: { late: 1 }, fx: { progress: 6, sanity: -8, hair: -5 }, result: '你把「综上所述」改成「总的来看」，\n把「显著提升」改成「提升明显」。\n改到最后，AI 率降到了 12%。\n你感觉自己像一个正在学习说人话的机器人。', next: 'n20chat' },
      { label: '加引用，疯狂加引用', tag: '学术裁缝', fx: { progress: 4, sanity: -3 }, result: '你加了四十篇参考文献。\nAI 率变成了 96.8%。\n你开始怀疑这个检测器是用脚写的。', next: 'n20chat' },
      { label: '中英互译，来回三遍', tag: '玄学', fx: { progress: 1, sanity: -5, hair: -2 }, result: '翻译回来的句子像喝了假酒。\nAI 率 99.1%。\n你人麻了。', next: 'n20chat' },
      { label: '不管了，能过查重就行', tag: '摆烂', flag: { aiCaught: true }, fx: { sanity: 2 }, result: '你把报告关掉。\n三天后，学院发了通知：\nAIGC 检测纳入盲审参考。', next: 'n20chat' }
    ] },

    n20chat: { ch: 'ch4', day: 85, scene: 'lab', who: 'narrator', expr: 'normal', text: '手机在桌上震了一下。\n屏幕亮起，是那个熟悉的头像。', chat: [

      { label: '老师，AI 率有点高，我正在改', tag: '坦白', fx: { favor: 3, sanity: -3 }, result: '王导：「多少？」\n你：「97。」\n王导：「……」\n王导：「改。改完发我。」\n你看着屏幕，觉得那个省略号比骂人还重。', next: 'n21' },
      { label: '装死，假装没看见', tag: '逃避', fx: { sanity: 4, favor: -6 }, result: '两小时后，王导在师门群里@了你。\n配文：「有的同学，微信不回，论文也不写。」\n全组已读。', next: 'n21' },
      { label: '回：在的，老师您说', tag: '乖巧', fx: { sanity: -2, favor: 1 }, result: '王导：「查重多少？」\n你：「2.8。」\n王导：「AI 率？」\n你：「……」\n王导：「我就知道。」', next: 'n21' }

    n21: { ch: 'ch4', day: 86, scene: 'office', who: 'advisor', expr: 'stern', text: '王导把你叫过去，指着屏幕：\n「你这个 AI 味，太冲了。」\n你闻了闻自己，只有三天没洗澡的味道。', choices: [
      { label: '老师，我确实用了 AI 辅助', tag: '坦白', flag: { aiFixed: true }, fx: { favor: 3, sanity: -3 }, result: '王导叹了口气：\n「工具可以用，但脑子得是自己的。」\n你点了点头。\n这次是真心的。', rw: 'advisor', re: 'normal', next: 'n22' },
      { label: '是润色软件自动改的', tag: '甩锅', cnt: { lie: 1 }, fx: { favor: -4, sanity: 1 }, result: '王导看了你一眼：\n「哪个润色软件会把『综上所述』用七次？」\n你张了张嘴，没说出话。', rw: 'advisor', re: 'angry', next: 'n22' },
      { label: '我当场重写一段给您看', tag: '补救', cnt: { late: 1 }, fx: { favor: 6, progress: 4, sanity: -6 }, result: '你现场重写了摘要。\n王导看完说：「这不是会写吗？」\n你心想：那是因为您在旁边看着。', rw: 'advisor', re: 'smug', next: 'n22' },
      { label: '老师，现在都这样', tag: '顶嘴', flag: { aiCaught: true }, fx: { favor: -8, sanity: 2 }, result: '王导沉默了很久：\n「那你毕业的时候，也让 AI 去答辩吧。」\n你意识到自己说错话了。', rw: 'advisor', re: 'angry', next: 'n22' }
    ] },

    n22: { ch: 'ch4', day: 88, scene: 'dorm', who: 'narrator', expr: 'tired', text: '降完 AI 率，你发了条朋友圈：\n「查重 2.8%，AI 率 97%，我成了 AI 的替身。已老实，求放过。」\n十分钟后，二十个赞，其中三个是实验室的。\n导师没点赞。你反而更慌了。', next: 'n23' },

    n23: { ch: 'ch5', day: 95, scene: 'meeting', who: 'narrator', expr: 'panic', text: '预答辩。\n你讲了二十分钟，评委老师翻了翻论文，问：\n「你这个工作量，是不是有点单薄？」', choices: [
      { label: '我回去加实验', tag: '听话', cnt: { late: 1 }, fx: { progress: 7, sanity: -7, hair: -3 }, result: '你又加了一个月的实验。\n论文从四万字变成了五万字，\n其中一万字是实验设置。', next: 'n24' },
      { label: '老师，我这个方法比较新', tag: '辩解', fx: { favor: -2, progress: 2, sanity: -2 }, result: '「新不代表够。」老师说。\n你点了点头，把这句话记在了心里。\n然后发现这句话已经有人发过朋友圈了。', rw: 'advisor', re: 'stern', next: 'n24' },
      { label: '老师，您觉得加什么合适？', tag: '请教', fx: { favor: 4, progress: 4, sanity: -2 }, result: '老师说了十分钟。\n你记了三条，其中两条互相矛盾。\n第三条是：「你自己把握。」', next: 'n24' },
      { label: '沉默，微笑，点头', tag: '已老实', fx: { sanity: -5, favor: -1 }, result: '你笑得很得体。\n回宿舍后，你在床上躺了两个小时。\n室友以为你睡着了，其实你在想那句话。', next: 'n24' }
    ] },

    n24: { ch: 'ch5', day: 100, scene: 'lab', who: 'narrator', expr: 'panic', text: '送审前夜。\n你检查了十八遍格式，发现参考文献的逗号是全角。\n提交系统在 23:59 崩溃了。\n你盯着「提交失败」四个字，心跳到一百二。', choices: [
      { label: '刷新，疯狂刷新', tag: '惊险', fx: { sanity: -6 }, result: '23:59:47，提交成功。\n你瘫在椅子上，像刚跑完一千米。\n然后发现，你把「致谢」写成了「致射」。\n你：蒜鸟，能提交就行。', next: 'n25' },
      { label: '找师兄，他有经验', tag: '求助', flag: { seniorHelp: true }, fx: { sanity: 2, progress: 1 }, result: '师兄远程指挥你改格式：\n「参考文献用半角逗号，你们这届怎么什么都不会。」\n你很想说：你们那届也没教。', rw: 'senior', re: 'smug', next: 'n25' },
      { label: '先睡，明天再说', tag: '佛系', fx: { sanity: 5, progress: -3 }, result: '第二天你被学院电话叫醒。\n截止时间延后了二十四小时。\n你第一次感谢行政效率。', next: 'n25' },
      { label: '把电脑合上，去阳台看星星', tag: '摆烂', fx: { sanity: 6, hair: -1 }, result: '你看了十分钟星星。\n回来发现系统自动保存了。\n玄学，是科研的一部分。', next: 'n25' }
    ] },

    n25: { ch: 'ch5', day: 103, scene: 'dorm', who: 'narrator', expr: 'tired', text: '送审了。\n接下来的两周，你每天刷新三次系统。\n第一天：「已送审」。\n第三天：「已送审」。\n第七天：「已送审」。\n你开始研究盲审专家的籍贯和星座。', choices: [
      { label: '继续刷，刷到出结果', tag: '焦虑', fx: { sanity: -8, hair: -2 }, result: '你刷新了二百一十四次。\n第二百一十五次，页面终于变了：\n「专家意见已返回」。\n你的手开始抖。', next: 'n26' },
      { label: '去寺庙拜拜', tag: '玄学', flag: { prayed: true }, fx: { sanity: 6, progress: -1 }, result: '你在寺庙里许愿：\n「让我毕业，我愿意用师兄的头发换。」\n师兄在实验室打了个喷嚏。', next: 'n26' },
      { label: '打游戏，转移注意力', tag: '逃避', fx: { sanity: 5, progress: -2 }, result: '你上了王者。\n但每次匹配加载，你都在想盲审。\n队友骂你演，你说：「我在等一个结果。」', next: 'n26' },
      { label: '趁等待再改改论文', tag: '卷', fx: { progress: 5, sanity: -4, hair: -2 }, result: '你把绪论重写了一遍。\n后来发现，盲审专家根本不看绪论。', next: 'n26' }
    ] },

    n26: { ch: 'ch5', day: 108, scene: 'lab', who: 'narrator', expr: 'panic', text: '盲审意见回来了。\n三个专家：\n「选题有意义，工作量尚可，建议修改后答辩。」\n「创新性不足，建议补充实验。」\n「格式规范，同意答辩。」\n最后一行：「是否同意答辩：修改后答辩。」', branch: [
      { if: function (s) { return s.flags.fakeData && !s.flags.dataFixed; }, to: 'n27fake' },

    n26ai: { ch: 'ch5', day: 108, scene: 'lab', who: 'narrator', expr: 'panic', text: '意见最后还有一行小字：\n「建议说明 AIGC 工具的使用情况。」\n你想起王导那句「脑子得是自己的」，\n手心又开始出汗。', next: 'n27' },

    n27fake: { ch: 'ch5', day: 109, scene: 'lab', who: 'narrator', expr: 'panic', text: '你刚松了口气，学院打来电话：\n「有一位专家提出，你的实验数据与原始记录不一致，请配合核查。」\n你的手心开始出汗。', choices: [
      { label: '主动说明，重新跑实验', tag: '补救', flag: { dataFixed: true }, fx: { sanity: -10, progress: 5 }, result: '你花了两个通宵重跑。\n数据对上了，但你也把『挑数据』的事写进了说明。\n王导替你说了很多话。\n你第一次觉得，他其实挺护着你。', next: 'n27' },
      { label: '删掉有问题的部分', tag: '掩盖', flag: { fakeCaught: true }, fx: { sanity: -12, favor: -10 }, result: '你删了数据。\n但原始记录还在服务器上。\n三天后，学院启动了学术不端调查。', ending: 'fake', next: '__end:fake' },
      { label: '找导师帮忙', tag: '求助', flag: { dataFixed: true }, fx: { favor: -3, sanity: -5 }, result: '王导看了你很久：「你知道这是什么性质吗？」\n他帮你联系了学院，也让你写了检查。\n你写了八千字。比论文还真诚。', rw: 'advisor', re: 'stern', next: 'n27' },
      { label: '装死，不回复', tag: '逃避', flag: { fakeCaught: true }, fx: { sanity: -15 }, result: '你没有回复。\n学院发了第二封邮件，抄送了导师和院长。\n你的手机响了。你没接。', ending: 'fake', next: '__end:fake' }
    ] },

    n27: { ch: 'ch5', day: 109, scene: 'lab', who: 'narrator', expr: 'tired', text: '你开始改论文。\n改到第三天，你发现专家说的『补充实验』，其实是要你重做一遍。\n你看着日历：距离答辩还有十五天。', choices: [
      { label: '肝，通宵肝', tag: '硬核', cnt: { late: 1 }, fx: { progress: 8, sanity: -10, hair: -6 }, result: '你连续熬了五个通宵。\n第六天，你在实验室醒来，脸上印着键盘的痕迹。\n师妹说：「师兄，你好像那个表情包。」', next: 'n28' },
      { label: '抓大放小，先保证能答辩', tag: '策略', fx: { progress: 5, sanity: -5 }, result: '你改了能改的，剩下的在回复里写「已补充说明」。\n你学会了学术界的太极拳。\n——打不过就绕着打。', next: 'n28' },
      { label: '找师妹帮忙', tag: '摇人', req: { flag: 'juniorHelp' }, fx: { progress: 4, sanity: -2, favor: 1 }, result: '师妹帮你跑了两组实验。\n你说请她吃饭，她说：「师兄，你先毕业吧。」\n你差点又哭了。', rw: 'junior', re: 'happy', next: 'n28' },
      { label: '先哭一场', tag: '情绪价值', fx: { sanity: 9, progress: -3 }, result: '你哭了二十分钟。\n哭完点了炸鸡，吃完打开电脑，继续改。\n成年人的崩溃，是要排期的。', next: 'n28' },
      { label: '头发和论文，总要没一个', tag: '献祭', flag: { baldPush: true }, cnt: { late: 1 }, fx: { progress: 12, sanity: -10, hair: -15 }, result: '你又熬了五个通宵。\n头顶越来越亮，论文越来越厚。\n你安慰自己：聪明绝顶。\n镜子没有反驳你。', next: 'n28' }
    ] },

    n28: { ch: 'ch6', day: 112, scene: 'defense', who: 'narrator', expr: 'panic', text: '答辩日。\n你穿上了唯一一件衬衫，站在教室门口。\n王导走过来，帮你理了理领子：\n「别紧张，他们都是我朋友。」\n你更紧张了。', next: 'n29' },

    n29: { ch: 'ch6', day: 115, scene: 'defense', who: 'narrator', expr: 'panic', text: '答辩开始。\n你讲了二十分钟，评委席上有人在看手机，有人在翻论文，还有人在打哈欠。\n提问环节。\n评委 A：「你这篇论文的创新点，用一句话概括。」', choices: [
      { label: '首次提出了一个面向 X 的 Y 框架', tag: '背稿', fx: { favor: 4, progress: 2, sanity: -3 }, result: '评委 A 点了点头：「概念很完整。」\n你听不出这是夸奖还是别的什么。\n王导在台下微微点头。', next: 'n30' },
      { label: '简单说，就是让 A 在 B 上更好用', tag: '说人话', fx: { favor: 2, sanity: 2 }, result: '评委 A 笑了一下：「这个说法倒是实在。」\n你松了口气。\n然后评委 B 翻开了论文。', next: 'n30' },
      { label: '这个……王导比较清楚', tag: '社死', fx: { favor: -8, sanity: -6 }, result: '王导在台下闭上了眼睛。\n评委 B 说：「那你清楚什么？」\n你想原地消失。', rw: 'advisor', re: 'dead', next: 'n30' },
      { label: '创新点在于把两个不相干的东西缝在一起', tag: '诚实', flag: { honest: true }, fx: { favor: -3, sanity: 3 }, result: '评委们互相看了一眼。\n评委 C 说：「缝合也是一种能力。」\n你分不清是不是在骂你。', next: 'n30' }
    ] },

    n30: { ch: 'ch6', day: 115, scene: 'defense', who: 'narrator', expr: 'panic', text: '评委 B 翻开论文，指着其中一页：\n「你这个方法和 XX 的方法，有什么区别？」\nXX 是你参考文献里的第四十七篇。你只看了摘要。', choices: [
      { label: '他从 A 角度切入，我从 B 角度', tag: '糊弄', cnt: { lie: 1 }, fx: { favor: -2, sanity: -3 }, result: '评委 B 追问：「B 角度具体是什么？」\n你开始后悔没看那篇论文。\n也后悔把摘要复制进了笔记。', next: 'n31' },
      { label: '我做了消融实验，证明模块有效', tag: '数据流', req: { flag: 'rigorous' }, fx: { favor: 5, progress: 2 }, result: '评委 B 翻了翻实验部分，没再追问。\n你偷偷松了口气。\n消融实验，是研究生的救命稻草。', next: 'n31' },
      { label: '坦白：这篇我没细看', tag: '诚实', fx: { favor: -4, sanity: 4 }, result: '评委 B 愣了一下，笑了：「你倒是诚实。回去补上。」\n你点点头，觉得他比想象中好说话。', next: 'n31' },
      { label: 'XX 的方法已经过时了', tag: '嘴硬', cnt: { lie: 1 }, fx: { favor: -6, sanity: 1 }, result: '评委 B 挑了下眉：「XX 是我师弟。」\n你想找个地缝。\n地缝里可能还有另一个评委。', next: 'n31' }
    ] },

    n31: { ch: 'ch6', day: 115, scene: 'defense', who: 'narrator', expr: 'panic', text: '评委 C 合上论文：\n「工作量感觉不太够啊。」\n这是今天第三次听到这句话。', choices: [
      { label: '我补充了三个实验，在附录里', tag: '有备而来', req: { min: { progress: 75 } }, fx: { favor: 6, progress: 3 }, result: '评委 C 翻到附录，点了点头。\n王导在台下悄悄比了个大拇指。\n你第一次觉得，那些通宵没有白熬。', next: 'n32' },
      { label: '老师，我已经尽力了', tag: '认怂', fx: { favor: -3, sanity: 3 }, result: '评委 C 叹了口气：「现在的学生都不容易。」\n你差点当场破防。\n但你忍住了。', next: 'n32' },
      { label: '那您觉得加到多少算够？', tag: '反问', fx: { favor: -2, sanity: -2 }, result: '评委 C 看了你三秒：「至少再加一章。」\n你小声：「那咋了。」\n评委 C：「？」\n王导在台下扶额。', rw: 'advisor', re: 'dead', next: 'n32' },
      { label: '沉默，然后开始讲情怀', tag: '煽情', fx: { favor: -4, sanity: 2 }, result: '你讲了你的研究理想。\n评委 C 打断你：「我问的是工作量。」\n情怀不能当章节用。', next: 'n32' }
    ] },

    n32: { ch: 'ch6', day: 116, scene: 'corridor', who: 'narrator', expr: 'panic', text: '答辩结束。你被请出教室，评委们开始闭门讨论。\n走廊里，你听到了自己的心跳。\n王导走出来，表情看不出喜怒。\n「进来吧。」', next: 'n33' },

    n33: { ch: 'ch6', day: 120, scene: 'defense', who: 'narrator', expr: 'panic', text: '你深吸一口气，推开门。\n评委主席抬起头，摘下眼镜。\n「经过答辩委员会讨论……」\n你听见自己的心跳，比服务器风扇还响。', ending: true }
  };

  function newState(route) {
    var hum = route === 'hum';
    return {
      route: hum ? 'hum' : 'stem',
      node: hum ? 'h1' : 'p1',
      stats: hum
        ? { progress: 6, favor: 50, sanity: 80, hair: 94 }
        : { progress: 8, favor: 50, sanity: 78, hair: 92 },
      flags: {},
      cnt: { late: 0, ai: 0, lie: 0 },
      day: 1,
      chapter: ''
    };
  }
  var S = newState('stem');
  var mode = 'title';
  var phase = 'title';
  var view = 'story';
  var current = null;
  var pendingNext = null;
  var unlocked = loadUnlocked();
  var cardActive = false;
  var cardTimer = null;
  var muted = false;

  function loadUnlocked() {
    try {
      var raw = localStorage.getItem(UNLOCK_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function unlockEnding(id) {
    if (unlocked.indexOf(id) < 0) {
      unlocked.push(id);
      try { localStorage.setItem(UNLOCK_KEY, JSON.stringify(unlocked)); } catch (e) {}
    }
  }
  function save() {
    try {
      var sn = STORY[S.node];
      var data = {
        v: 1, route: S.route, node: S.node, stats: S.stats, flags: S.flags, cnt: S.cnt,
        day: (sn && sn.day) || S.day, chapter: (sn && sn.ch) || S.chapter, ts: Date.now()
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !d.node || !STORY[d.node]) return null;
      return d;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* ============================================================
   * 音效

  var actx = null;
  function initAudio() {
    if (actx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol, when) {
    if (!actx || muted) return;
    try {
      var t0 = actx.currentTime + (when || 0);
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol == null ? 0.05 : vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function sfx(kind) {
    if (muted) return;
    initAudio();
    if (!actx) return;
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    if (kind === 'tap') tone(620, 0.05, 'sine', 0.025);
    else if (kind === 'choose') { tone(520, 0.06, 'triangle', 0.04); tone(780, 0.09, 'triangle', 0.035, 0.05); }
    else if (kind === 'good') { tone(660, 0.1, 'sine', 0.045); tone(990, 0.14, 'sine', 0.035, 0.08); }
    else if (kind === 'bad') { tone(220, 0.14, 'sawtooth', 0.03); tone(160, 0.2, 'sawtooth', 0.025, 0.08); }
    else if (kind === 'chapter') { tone(392, 0.5, 'sine', 0.035); tone(523, 0.6, 'sine', 0.03, 0.08); tone(784, 0.7, 'sine', 0.02, 0.16); }
    else if (kind === 'ending') { tone(523, 0.5, 'sine', 0.04); tone(659, 0.55, 'sine', 0.035, 0.12); tone(784, 0.7, 'sine', 0.03, 0.24); }
  }

  /* ============================================================
   * 场景绘制

  var sceneNow = 'lab';
  var sceneT = 0;

  function rr(g, x, y, w, h, r) {
    var rr2 = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr2, y);
    g.arcTo(x + w, y, x + w, y + h, rr2);
    g.arcTo(x + w, y + h, x, y + h, rr2);
    g.arcTo(x, y + h, x, y, rr2);
    g.arcTo(x, y, x + w, y, rr2);
    g.closePath();
  }

  function drawCity(g, x, y, w, h, t) {
    g.save();
    rr(g, x, y, w, h, 4); g.clip();
    var sky = g.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, '#0a1526'); sky.addColorStop(1, '#152338');
    g.fillStyle = sky; g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(232,240,252,.85)';
    g.beginPath(); g.arc(x + w * 0.76, y + h * 0.22, Math.min(w, h) * 0.075, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.18)';
    for (var s = 0; s < 22; s++) {
      g.beginPath();
      g.arc(x + w * rnd(s + 3), y + h * rnd(s + 11) * 0.55, 0.8 + rnd(s + 7) * 0.9, 0, 7);
      g.fill();
    }
    var base = y + h;
    for (var i = 0; i < 15; i++) {
      var bw = w * (0.05 + rnd(i + 1) * 0.075);
      var bh = h * (0.18 + rnd(i + 7) * 0.52);
      var bx = x + w * rnd(i + 13) * 0.95;
      g.fillStyle = 'rgba(8,16,29,.96)';
      g.fillRect(bx, base - bh, bw, bh);
      for (var j = 0; j < 8; j++) {
        if (rnd(i * 9 + j) > 0.52) {
          g.fillStyle = 'rgba(255,212,128,' + (0.28 + 0.55 * rnd(i + j * 3)) + ')';
          g.fillRect(bx + bw * 0.16 + (j % 2) * bw * 0.42, base - bh + bh * 0.1 + Math.floor(j / 2) * bh * 0.13, bw * 0.16, bh * 0.045);
        }
      }
    }
    g.restore();
  }

  function drawDust(g, w, h, t, color) {
    for (var i = 0; i < 16; i++) {
      var px = (rnd(i + 1) * w + t * (4 + rnd(i) * 8)) % w;
      var py = rnd(i + 5) * h * 0.66 + Math.sin(t * 0.4 + i) * 7;
      g.fillStyle = color || 'rgba(180,220,255,' + (0.05 + 0.09 * rnd(i + 9)) + ')';
      g.beginPath(); g.arc(px, py, 1 + rnd(i + 3) * 1.3, 0, 7); g.fill();
    }
  }

  function drawMonitor(g, x, y, w, h, t) {
    var sh = h * 0.88;
    g.fillStyle = '#1b2430'; g.fillRect(x + w * 0.42, y + sh, w * 0.16, h * 0.12);
    g.fillStyle = '#131a23'; g.fillRect(x + w * 0.3, y + sh - 1, w * 0.4, h * 0.035);
    g.fillStyle = '#080f16'; rr(g, x, y, w, sh, 5); g.fill();
    g.strokeStyle = '#2b3c4e'; g.lineWidth = 2.5; rr(g, x, y, w, sh, 5); g.stroke();
    var glow = g.createRadialGradient(x + w / 2, y + sh / 2, 4, x + w / 2, y + sh / 2, w * 0.9);
    glow.addColorStop(0, 'rgba(80,230,210,.20)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow; g.fillRect(x - w * 0.3, y - h * 0.5, w * 1.6, h * 1.9);
    g.save();
    rr(g, x + 2, y + 2, w - 4, sh - 4, 4); g.clip();
    g.strokeStyle = 'rgba(110,235,215,.22)'; g.lineWidth = 1;
    for (var l = 0; l < 5; l++) { g.beginPath(); g.moveTo(x + 6, y + 10 + l * 9); g.lineTo(x + w - 10, y + 10 + l * 9); g.stroke(); }
    g.strokeStyle = 'rgba(110,235,215,.9)'; g.lineWidth = 2;
    g.beginPath();
    for (var i = 0; i <= 44; i++) {
      var px = x + w * 0.07 + w * 0.86 * (i / 44);
      var py = y + sh * 0.16 + sh * 0.62 * (0.45 + 0.32 * Math.sin(i * 0.55 + t * 0.35) * (1 - i / 70));
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();
    g.fillStyle = 'rgba(110,235,215,.16)';
    g.fillRect(x + 6, y + sh * 0.72, w - 12, sh * 0.24);
    g.restore();
  }

  function drawNote(g, x, y, color, rot, w, h) {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = color; g.fillRect(-w / 2, -h / 2, w, h);
    g.fillStyle = 'rgba(0,0,0,.07)'; g.fillRect(-w / 2, -h / 2, w, 4);
    g.strokeStyle = 'rgba(60,45,20,.28)'; g.lineWidth = 1;
    for (var i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-w * 0.32, -h * 0.1 + i * 5); g.lineTo(w * 0.3, -h * 0.1 + i * 5); g.stroke(); }
    g.restore();
  }

  function sceneLab(g, w, h, t) {
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#141d2b'); grad.addColorStop(0.5, '#0d141e'); grad.addColorStop(1, '#080b10');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);

    var lg = g.createRadialGradient(w * 0.2, h * 0.02, 0, w * 0.2, h * 0.02, w * 0.8);
    lg.addColorStop(0, 'rgba(120,190,230,.16)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg; g.fillRect(0, 0, w, h);

    var wx = w * 0.54, wy = h * 0.10, ww = w * 0.41, wh = h * 0.29;
    g.fillStyle = '#080e18'; rr(g, wx, wy, ww, wh, 3); g.fill();
    drawCity(g, wx + 4, wy + 4, ww - 8, wh - 8, t);
    g.strokeStyle = 'rgba(150,185,220,.32)'; g.lineWidth = 3; g.strokeRect(wx, wy, ww, wh);
    g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh);
    g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.stroke();

    drawNote(g, w * 0.1, h * 0.17, '#f2d06b', -0.08, w * 0.11, w * 0.1);
    drawNote(g, w * 0.24, h * 0.13, '#f5a3a3', 0.07, w * 0.095, w * 0.09);
    drawNote(g, w * 0.16, h * 0.29, '#9fd9c0', -0.03, w * 0.08, w * 0.075);

    var dy = h * 0.6;
    g.fillStyle = '#141a22'; g.fillRect(0, dy, w, h - dy);
    g.fillStyle = 'rgba(140,190,220,.10)'; g.fillRect(0, dy, w, 3);
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, dy + 3, w, 10);

    drawMonitor(g, w * 0.1, dy - h * 0.235, w * 0.36, h * 0.235, t);

    var lamp = g.createRadialGradient(w * 0.42, dy - h * 0.13, 0, w * 0.42, dy - h * 0.13, w * 0.34);
    lamp.addColorStop(0, 'rgba(255,205,120,.16)'); lamp.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lamp; g.fillRect(0, dy - h * 0.4, w, h * 0.45);

    // coffee cup on the desk
    var cx = w * 0.435, cy = dy - h * 0.058, cw = w * 0.045, chh = h * 0.052;
    g.fillStyle = '#e8ddc8';
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + cw, cy);
    g.lineTo(cx + cw * 0.86, cy + chh);
    g.lineTo(cx + cw * 0.14, cy + chh);
    g.closePath(); g.fill();
    g.fillStyle = '#8a5a3a';
    g.beginPath(); g.ellipse(cx + cw / 2, cy, cw / 2, cw * 0.16, 0, 0, 7); g.fill();
    g.strokeStyle = '#e8ddc8'; g.lineWidth = Math.max(2, w * 0.008);
    g.beginPath(); g.arc(cx + cw * 1.02, cy + chh * 0.42, chh * 0.22, -1.2, 1.2); g.stroke();
    g.strokeStyle = 'rgba(255,235,205,.22)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx + cw * 0.35, cy - h * 0.02); g.quadraticCurveTo(cx + cw * 0.1, cy - h * 0.05, cx + cw * 0.38, cy - h * 0.085); g.stroke();
    g.beginPath(); g.moveTo(cx + cw * 0.66, cy - h * 0.02); g.quadraticCurveTo(cx + cw * 0.9, cy - h * 0.05, cx + cw * 0.64, cy - h * 0.085); g.stroke();

    drawDust(g, w, h, t);
  }

  function sceneOffice(g, w, h, t) {
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#251d16'); grad.addColorStop(0.55, '#191410'); grad.addColorStop(1, '#0e0b09');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);

    var warm = g.createRadialGradient(w * 0.24, h * 0.08, 0, w * 0.24, h * 0.08, w * 0.6);
    warm.addColorStop(0, 'rgba(255,190,110,.16)'); warm.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = warm; g.fillRect(0, 0, w, h);

    // bookshelf
    var bx = w * 0.03, by = h * 0.1, bw = w * 0.3, bh = h * 0.43;
    g.fillStyle = '#2a2018'; g.fillRect(bx, by, bw, bh);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4;
    for (var r = 0; r < 4; r++) {
      var sy = by + bh * (r + 1) / 4;
      g.beginPath(); g.moveTo(bx, sy); g.lineTo(bx + bw, sy); g.stroke();
      for (var b = 0; b < 7; b++) {
        var bwd = bw * (0.07 + rnd(r * 9 + b) * 0.06);
        var bhh = bh / 4 * (0.5 + rnd(r + b * 4) * 0.34);
        var bxx = bx + bw * 0.04 + b * bw * 0.13;
        var cols = ['#8a5a3a', '#5a6e8a', '#7a4a4a', '#6d7a52', '#8a7a4a', '#4e5a6a'];
        g.fillStyle = cols[Math.floor(rnd(r + b) * cols.length)];
        g.fillRect(bxx, sy - bhh, bwd, bhh);
        g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(bxx, sy - bhh, bwd, 2);
      }
    }
    g.fillStyle = '#2a2018'; g.fillRect(bx, by + bh, bw, 5);

    // window with blinds
    var wx = w * 0.55, wy = h * 0.09, ww = w * 0.38, wh = h * 0.3;
    g.fillStyle = '#0b1220'; rr(g, wx, wy, ww, wh, 3); g.fill();
    drawCity(g, wx + 4, wy + 4, ww - 8, wh - 8, t);
    g.fillStyle = 'rgba(30,24,18,.7)';

    // desk
    var dy = h * 0.6;
    g.fillStyle = '#1e1712'; g.fillRect(0, dy, w, h - dy);
    g.fillStyle = '#3a2b1e'; g.fillRect(0, dy, w, 7);
    // certificate
    g.fillStyle = '#d9c9a8'; g.fillRect(w * 0.4, h * 0.16, w * 0.1, h * 0.075);
    g.strokeStyle = '#8a744e'; g.lineWidth = 2; g.strokeRect(w * 0.4, h * 0.16, w * 0.1, h * 0.075);
    g.fillStyle = '#a8905f'; g.fillRect(w * 0.425, h * 0.175, w * 0.05, h * 0.012);

    // lamp
    var lamp = g.createRadialGradient(w * 0.15, dy - h * 0.12, 0, w * 0.15, dy - h * 0.12, w * 0.3);
    lamp.addColorStop(0, 'rgba(255,190,110,.22)'); lamp.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lamp; g.fillRect(0, 0, w * 0.6, h * 0.7);

  function sceneCorridor(g, w, h, t) {
    var grad = g.createLinearGradient(0, 0, 0, h);

    }
    g.fillStyle = 'rgba(255,240,210,.06)';
    g.beginPath(); g.moveTo(w * 0.2, h * 0.02); g.lineTo(w * 0.8, h * 0.02); g.lineTo(w * 0.55, h * 0.6); g.lineTo(w * 0.45, h * 0.6); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(w * 0.39, h * 0.02, w * 0.22, 4);
    for (var d = 0; d < 3; d++) {

  function sceneNight(g, w, h, t) {
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0a1024'); grad.addColorStop(0.5, '#131a30'); grad.addColorStop(1, '#1a1f2c');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);

    for (var i = 0; i < 70; i++) {
      var sx = rnd(i + 1) * w, sy = rnd(i + 7) * h * 0.55;
      g.fillStyle = 'rgba(230,240,255,' + (0.15 + 0.6 * rnd(i + 3) * (0.7 + 0.3 * Math.sin(t * 1.4 + i))) + ')';
      g.beginPath(); g.arc(sx, sy, 0.7 + rnd(i + 11) * 1.1, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(240,235,210,.9)';
    g.beginPath(); g.arc(w * 0.72, h * 0.15, Math.min(w, h) * 0.07, 0, 7); g.fill();
    g.fillStyle = 'rgba(240,235,210,.1)';
    g.beginPath(); g.arc(w * 0.72, h * 0.15, Math.min(w, h) * 0.1, 0, 7); g.fill();

    // campus silhouette
    var base = h * 0.66;
    g.fillStyle = '#0b0f18';
    g.fillRect(0, base, w, h - base);
    for (var b = 0; b < 7; b++) {
      var bw = w * (0.08 + rnd(b + 2) * 0.1);
      var bh = h * (0.08 + rnd(b + 5) * 0.18);
      var bx = w * rnd(b + 9) * 0.92;
      g.fillStyle = '#0b0f18'; g.fillRect(bx, base - bh, bw, bh);
      for (var win = 0; win < 6; win++) {
        if (rnd(b * 5 + win) > 0.55) {
          g.fillStyle = 'rgba(255,210,130,.55)';
          g.fillRect(bx + bw * 0.15 + (win % 3) * bw * 0.28, base - bh + bh * (0.2 + Math.floor(win / 3) * 0.3), bw * 0.12, bh * 0.1);
        }
      }
    }
    // street lamp
    g.strokeStyle = '#2a3140'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(w * 0.12, base); g.lineTo(w * 0.12, base - h * 0.22); g.lineTo(w * 0.18, base - h * 0.22); g.stroke();
    var lg = g.createRadialGradient(w * 0.18, base - h * 0.21, 0, w * 0.18, base - h * 0.21, w * 0.2);
    lg.addColorStop(0, 'rgba(255,215,140,.3)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg; g.beginPath(); g.arc(w * 0.18, base - h * 0.21, w * 0.2, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,225,160,.8)'; g.beginPath(); g.arc(w * 0.18, base - h * 0.21, 3, 0, 7); g.fill();
  }

  function sceneLibrary(g, w, h, t) {
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#211a13'); grad.addColorStop(0.55, '#15100c'); grad.addColorStop(1, '#0b0907');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);

    var warm = g.createRadialGradient(w * 0.28, h * 0.12, 0, w * 0.28, h * 0.12, w * 0.7);
    warm.addColorStop(0, 'rgba(255,190,110,.14)'); warm.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = warm; g.fillRect(0, 0, w, h);

    // tall bookshelves
    var rows = 5, top = h * 0.06, bottom = h * 0.62;
    for (var s = 0; s < 2; s++) {
      var bx = s === 0 ? w * 0.02 : w * 0.26, bw = w * 0.22;
      g.fillStyle = '#2b2117'; g.fillRect(bx, top, bw, bottom - top);
      g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 3;
      for (var r = 0; r < rows; r++) {
        var sy = top + (bottom - top) * (r + 1) / rows;
        g.beginPath(); g.moveTo(bx, sy); g.lineTo(bx + bw, sy); g.stroke();
        for (var b = 0; b < 8; b++) {
          var bwd = bw * (0.055 + rnd(r * 7 + b + s) * 0.045);
          var bhh = (bottom - top) / rows * (0.5 + rnd(r + b * 3 + s) * 0.36);
          var bxx = bx + bw * 0.03 + b * bw * 0.118;
          var cols = ['#8a5a3a', '#5a6e8a', '#7a4a4a', '#6d7a52', '#8a7a4a', '#4e5a6a', '#9a7a4a'];
          g.fillStyle = cols[Math.floor(rnd(r * 3 + b + s) * cols.length)];
          g.fillRect(bxx, sy - bhh, bwd, bhh);
          g.fillStyle = 'rgba(255,220,160,.18)'; g.fillRect(bxx, sy - bhh, bwd, 2);
        }
      }
      g.fillStyle = '#241b12'; g.fillRect(bx, bottom, bw, 5);
    }

    // arched window
    var wx = w * 0.56, wy = h * 0.07, ww = w * 0.36, wh = h * 0.33;
    g.save();
    g.beginPath();
    g.moveTo(wx, wy + wh);
    g.lineTo(wx, wy + wh * 0.35);
    g.quadraticCurveTo(wx, wy, wx + ww / 2, wy);
    g.quadraticCurveTo(wx + ww, wy, wx + ww, wy + wh * 0.35);
    g.lineTo(wx + ww, wy + wh);
    g.closePath();
    g.clip();
    var sky = g.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, '#1a2740'); sky.addColorStop(0.6, '#2f3f52'); sky.addColorStop(1, '#6b5a45');
    g.fillStyle = sky; g.fillRect(wx, wy, ww, wh);
    g.fillStyle = 'rgba(240,220,170,.55)';
    g.beginPath(); g.arc(wx + ww * 0.7, wy + wh * 0.3, ww * 0.06, 0, 7); g.fill();
    g.fillStyle = 'rgba(20,24,30,.8)';
    for (var c = 0; c < 8; c++) {
      var cw = ww * (0.08 + rnd(c + 4) * 0.1);
      var chh = wh * (0.12 + rnd(c + 9) * 0.25);
      g.fillRect(wx + ww * rnd(c + 2) * 0.92, wy + wh - chh, cw, chh);
    }
    g.restore();
    g.strokeStyle = '#3a2c1e'; g.lineWidth = 6;
    g.beginPath();
    g.moveTo(wx, wy + wh);
    g.lineTo(wx, wy + wh * 0.35);
    g.quadraticCurveTo(wx, wy, wx + ww / 2, wy);
    g.quadraticCurveTo(wx + ww, wy, wx + ww, wy + wh * 0.35);
    g.lineTo(wx + ww, wy + wh);
    g.stroke();
    g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();

    // reading table + green lamps
    var ty = h * 0.62;
    g.fillStyle = '#241a12'; g.fillRect(0, ty, w, h - ty);
    g.fillStyle = '#3a2a1c'; g.fillRect(0, ty, w, 6);
    for (var l = 0; l < 2; l++) {
      var lx = w * (0.12 + l * 0.28);
      var glow = g.createRadialGradient(lx, ty - h * 0.08, 0, lx, ty - h * 0.08, w * 0.22);
      glow.addColorStop(0, 'rgba(255,210,120,.22)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = glow; g.fillRect(lx - w * 0.2, ty - h * 0.3, w * 0.4, h * 0.35);
      g.fillStyle = '#1f3a2c';
      g.beginPath(); g.moveTo(lx - w * 0.07, ty); g.lineTo(lx - w * 0.035, ty - h * 0.08); g.lineTo(lx + w * 0.035, ty - h * 0.08); g.lineTo(lx + w * 0.07, ty); g.closePath(); g.fill();
      g.fillStyle = '#d9b06a'; g.fillRect(lx - 2, ty - h * 0.16, 4, h * 0.08);
      g.beginPath(); g.ellipse(lx, ty - h * 0.16, w * 0.05, h * 0.012, 0, 0, 7); g.fill();
      // open book
      g.fillStyle = '#e6dcc6'; g.fillRect(lx - w * 0.13, ty - h * 0.02, w * 0.09, h * 0.02);
      g.fillRect(lx + w * 0.04, ty - h * 0.02, w * 0.09, h * 0.02);
    }

    drawDust(g, w, h, t, 'rgba(255,220,170,.05)');
  }

  }

  function sceneCafe(g, w, h, t) {

      g.beginPath(); g.moveTo(-40, -112); g.quadraticCurveTo(-8, -126, 30, -112); g.stroke();
      g.globalAlpha = 1;
      // scrunchie
      g.fillStyle = P.accent;
      g.beginPath(); g.ellipse(66, -24, 9, 13, 0.2, 0, 7); g.fill();
    }
  }

  function drawExtras(g, key, P) {
    if (key === 'hero') {
      // lanyard + card
      g.strokeStyle = '#c9d4e2'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(-18, 116); g.lineTo(-30, 152); g.moveTo(18, 116); g.lineTo(30, 152); g.stroke();
      g.fillStyle = '#e9edf3'; rr(g, -34, 150, 68, 44, 4); g.fill();
      g.fillStyle = '#9fb2c6'; g.fillRect(-12, 158, 24, 18);
      g.fillStyle = '#6b7c90'; g.fillRect(16, 160, 12, 3); g.fillRect(16, 167, 10, 3); g.fillRect(16, 174, 12, 3);
      g.fillStyle = P.accent; g.fillRect(-34, 150, 68, 5);
    } else if (key === 'advisor') {
      // thermos
      g.fillStyle = '#8f96a0'; rr(g, 96, 120, 34, 54, 6); g.fill();
      g.fillStyle = '#b9c0c8'; g.fillRect(99, 124, 8, 46);
      g.fillStyle = '#7a2f2a'; rr(g, 94, 112, 38, 14, 4); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.32)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(103, 108); g.quadraticCurveTo(98, 98, 105, 90); g.stroke();
      g.beginPath(); g.moveTo(113, 108); g.quadraticCurveTo(118, 96, 111, 86); g.stroke();
    } else if (key === 'senior') {
      // stubble
      g.fillStyle = 'rgba(40,36,34,.35)';
      for (var i = 0; i < 26; i++) {
        var a = -0.9 + rnd(i) * 1.8;
        var rad = 44 + rnd(i + 3) * 12;
        g.beginPath(); g.arc(Math.sin(a) * rad, 12 + Math.cos(a) * rad * 0.55, 1.2, 0, 7); g.fill();
      }
    } else if (key === 'junior') {
      // headphones around neck
      g.strokeStyle = '#33333d'; g.lineWidth = 9; g.lineCap = 'round';
      g.beginPath(); g.arc(0, 80, 58, 0.1, Math.PI - 0.1); g.stroke();
      g.fillStyle = '#33333d';
      rr(g, -68, 66, 20, 28, 8); g.fill();
      rr(g, 48, 66, 20, 28, 8); g.fill();
      g.fillStyle = '#7fe0c8';
      rr(g, -63, 72, 10, 16, 5); g.fill();
      rr(g, 53, 72, 10, 16, 5); g.fill();
    }
  }

  /* ============================================================
   * 图片 / 背景
   * ============================================================ */
  var images = {};
  function hasCustomArt(key) {
    return !!(SLOTS[key] && SLOTS[key].custom);
  }
  function preload() {
    Object.keys(ASSETS).forEach(function (k) {
      if (!ASSETS[k]) return;
      var img = new Image();
      img.onload = function () { images[k] = img; if (k === 'background') drawBg(); };
      img.src = ASSETS[k];
    });
  }

  var bgW = 0, bgH = 0, dpr = 1;
  function resizeAll() {
    var rect = shell.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    bgW = Math.max(1, Math.round(rect.width));
    bgH = Math.max(1, Math.round(rect.height));
    bgCanvas.width = Math.round(bgW * dpr);
    bgCanvas.height = Math.round(bgH * dpr);
    bgCanvas.style.width = bgW + 'px';
    bgCanvas.style.height = bgH + 'px';
    drawBg();
  }

  function drawBg() {
    if (!bgW || !bgH) return;
    var g = bgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, bgW, bgH);
    if (hasCustomArt('background') && images.background && images.background.naturalWidth && S.route === 'stem' && sceneNow === 'lab') {
      var img = images.background;
      var ar = img.naturalWidth / img.naturalHeight;
      var cr = bgW / bgH, dw, dh;
      if (ar > cr) { dh = bgH; dw = bgH * ar; } else { dw = bgW; dh = bgW / ar; }
      g.drawImage(img, (bgW - dw) / 2, (bgH - dh) / 2, dw, dh);
      g.fillStyle = 'rgba(5,8,13,.48)'; g.fillRect(0, 0, bgW, bgH);
    } else {
      drawScene(g, bgW, bgH, sceneNow, sceneT);
    }
  }

  function renderPortrait(who, expr) {
    var key = (who === 'narrator' || who === 'system') ? 'hero' : who;
    if (!PALETTE[key]) key = 'hero';
    var c = portraitCanvas, g = portraitCtx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, c.width, c.height);
    g.save();
    g.translate(c.width / 2, c.height * 0.53);
    drawCharacter(g, key, c.width * 0.94, expr || 'normal');
    g.restore();
    portraitWrap.classList.remove('show');
    portraitWrap.dataset.who = key;
    // force reflow so the entrance animation replays
    void portraitWrap.offsetWidth;
    portraitWrap.classList.add('show');
    portraitCanvas.style.opacity = (who === 'narrator' || who === 'system') ? '0.92' : '1';
  }

  /* ============================================================
   * HUD
   * ============================================================ */
  function updateHud() {
    var c = CHAPTERS[S.chapter] || CHAPTERS.ch0;
    chapterLabel.textContent = c.num + ' · ' + c.name;
    dayLabel.textContent = 'DAY ' + S.day;
    for (var k in S.stats) {
      var card = document.querySelector('.stat[data-k="' + k + '"]');
      if (!card) continue;
      var v = Math.round(S.stats[k]);
      card.querySelector('.val').textContent = v;
      card.querySelector('.bar i').style.width = clamp(v, 0, MAX) + '%';
      if (v <= 22) card.classList.add('low'); else card.classList.remove('low');
    }
  }
  function pulseStat(k, d) {
    var card = document.querySelector('.stat[data-k="' + k + '"]');
    if (!card) return;
    card.classList.remove('up', 'down');
    void card.offsetWidth;
    card.classList.add(d > 0 ? 'up' : 'down');
    setTimeout(function () { card.classList.remove('up', 'down'); }, 700);
    var f = document.createElement('span');
    f.className = 'stat-float ' + (d > 0 ? 'up' : 'down');
    f.textContent = (d > 0 ? '+' : '') + d;
    card.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
  }

  /* ============================================================
   * 打字机 / 对话
   * ============================================================ */
  var typing = false, typeTimer = null, fullText = '', typeDone = null;
  var TYPE_MS = Math.max(4, Number(RULES.typeSpeed) || 18);

  function typeText(txt, done) {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    fullText = txt || '';
    typeDone = done || null;
    typing = true;
    textEl.textContent = '';
    textEl.scrollTop = 0;
    var shown = 0;
    var stepMs = Math.max(6, Number(RULES.typeSpeed) || 18);
    typeTimer = setInterval(function () {
      shown += 2;
      if (shown >= fullText.length) {
        textEl.textContent = fullText;
        textEl.scrollTop = textEl.scrollHeight;
        stopTyping(true);
      } else {
        textEl.textContent = fullText.slice(0, shown);
        textEl.scrollTop = textEl.scrollHeight;
      }
    }, stepMs);
  }
  function stopTyping(natural) {
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    typing = false;
    textEl.textContent = fullText;
    var cb = typeDone; typeDone = null;
    if (cb) cb();
  }
  function finishTyping() {
    if (!typing) return;
    stopTyping(false);
  }

  function speakerName(who) {
    if (S.route === 'hum' && HUM_NAMES[who]) return HUM_NAMES[who];
    return (SPEAKERS[who] || SPEAKERS.narrator).name;
  }
  function setSpeaker(who) {
    var sp = SPEAKERS[who] || SPEAKERS.narrator;
    speakerEl.textContent = speakerName(who);
    speakerEl.style.background = sp.color;
  }

  function renderDeltas(deltas) {
    deltasEl.innerHTML = '';
    if (!deltas || !deltas.length) return;
    deltas.forEach(function (d) {
      var s = document.createElement('span');
      s.className = 'delta ' + (d.d > 0 ? 'up' : 'down');
      s.textContent = STAT_SHORT[d.k] + ' ' + (d.d > 0 ? '+' : '') + d.d;
      deltasEl.appendChild(s);
    });
  }

  function showHint(txt) {
    hintEl.textContent = txt || '点击继续 ▾';
    hintEl.classList.remove('hidden');
  }
  function hideHint() { hintEl.classList.add('hidden'); }

  function clearChoices() {
    choicesEl.innerHTML = '';
    deltasEl.innerHTML = '';
    pickedEl.classList.add('hidden');
    pickedEl.innerHTML = '';
    hideHint();
  }

  /* ============================================================
   * 章节卡
   * ============================================================ */
  function showChapterCard(chKey) {
    var c = CHAPTERS[chKey];
    if (!c) return;
    chapterCard.querySelector('.cc-num').textContent = c.num;
    chapterCard.querySelector('.cc-name').textContent = c.name;
    chapterCard.querySelector('.cc-sub').textContent = c.sub;
    chapterCard.classList.add('show');
    cardActive = true;
    sfx('chapter');
    if (cardTimer) clearTimeout(cardTimer);
    cardTimer = setTimeout(hideChapterCard, 1900);
  }
  function hideChapterCard() {
    if (cardTimer) { clearTimeout(cardTimer); cardTimer = null; }
    chapterCard.classList.remove('show');
    cardActive = false;
  }

  /* ============================================================
   * 剧情流程
   * ============================================================ */
  function nodeNext(n) {
    if (!n) return null;
    if (n.branch) {
      for (var i = 0; i < n.branch.length; i++) {
        var b = n.branch[i];
        if (!b.if || b.if(S)) return b.to;
      }
      return n.next || null;
    }
    return n.next || null;
  }

  function goto(id) {
    if (!id) return;
    if (id.indexOf('__end:') === 0) { endGame(id.slice(6)); return; }
    if (id === '__burnout') { endGame('burnout'); return; }
    var n = STORY[id];
    if (!n) { console.warn('[story] missing node', id); return; }
    mode = 'play';
    phase = 'playing';
    shell.classList.remove('covered');
    overlay.classList.remove('on');
    overlay.innerHTML = '';
    current = n;
    view = 'story';
    pendingNext = null;
    if (n.ch && n.ch !== S.chapter) { S.chapter = n.ch; showChapterCard(n.ch); }
    if (n.day) S.day = n.day;
    S.node = id;
    save();
    updateHud();
    postState();
    if (n.scene) sceneNow = n.scene;
    renderNode(n);
  }

  function renderNode(n) {
    view = 'story';
    pendingNext = null;
    clearChoices();
    if (n.chat) { renderChat(n.chat); portraitWrap.classList.remove('show'); }
    else { chatBox.classList.add('hidden'); chatBox.innerHTML = ''; }
    var who = n.who || 'narrator';
    setSpeaker(who);
    if (!n.chat) renderPortrait(who, n.expr || (who === 'narrator' ? 'tired' : 'normal'));
    textEl.textContent = '';
    typeText(n.text || '', function () { afterText(n); });
  }

  function afterText(n) {
    if (view !== 'story') return;
    if (n.choices && n.choices.length) {
      renderChoices(n);
      return;
    }
    if (n.ending) { showHint('点击，听结果 ▸'); return; }
    if (nodeNext(n)) { showHint('点击继续 ▾'); return; }
    showHint('点击继续 ▾');
  }

  function renderChat(msgs) {
    chatBox.innerHTML = '<div class="chat-head">微信 · ' + esc(speakerName('advisor')) + '</div>';
    chatBox.classList.remove('hidden');
    msgs.forEach(function (m, i) {
      var d = document.createElement('div');
      d.className = 'msg' + (m.me ? ' me' : '');
      d.style.animationDelay = (i * 0.35) + 's';
      d.innerHTML = (m.who ? '<span class="who">' + esc(m.who) + '</span>' : '') + esc(m.text);
      chatBox.appendChild(d);
    });
  }

  function renderChoices(n) {
    choicesEl.innerHTML = '';
    hideHint();
    n.choices.forEach(function (c, i) {
      var ok = reqOk(c.req);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice' + (ok ? '' : ' locked');
      b.style.animationDelay = (i * 0.06) + 's';
      b.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="ctext">' + esc(c.label) +
        (c.tag ? '<span class="tag">' + esc(c.tag) + '</span>' : '') +
        (ok ? '' : '<span class="lock">🔒 ' + esc(reqLabel(c.req)) + '</span>') +
        '</span>';
      if (ok) b.addEventListener('click', function (e) { e.stopPropagation(); choose(c); });
      choicesEl.appendChild(b);
    });
  }

  function reqOk(req) {
    if (!req) return true;
    if (req.flag && !S.flags[req.flag]) return false;
    if (req.notFlag && S.flags[req.notFlag]) return false;
    if (req.min) {
      for (var k in req.min) if ((S.stats[k] || 0) < req.min[k]) return false;
    }
    return true;
  }
  function reqLabel(req) {
    if (!req) return '';
    if (req.flag) return '需要：' + ({ seniorHelp: '师兄的帮助', juniorHelp: '师妹的帮助', rigorous: '扎实的实验' }[req.flag] || req.flag);
    if (req.notFlag) return '已无法选择';
    if (req.min) {
      var parts = [];
      for (var k in req.min) parts.push(STAT_SHORT[k] + ' ≥ ' + req.min[k]);
      return parts.join('，');
    }
    return '未满足条件';
  }

  function applyFx(fx) {
    var out = [];
    if (!fx) return out;
    for (var k in fx) {
      if (!(k in S.stats)) continue;
      var before = S.stats[k];
      S.stats[k] = clamp(before + fx[k], 0, MAX);
      var d = Math.round(S.stats[k] - before);
      if (d !== 0) { out.push({ k: k, d: d }); pulseStat(k, d); }
    }
    return out;
  }
  function applyFlags(flags) {
    if (!flags) return;
    for (var k in flags) S.flags[k] = flags[k];
  }
  function applyCnt(cnt) {
    if (!cnt) return;
    for (var k in cnt) S.cnt[k] = (S.cnt[k] || 0) + cnt[k];
  }

  function choose(c) {
    if (mode !== 'play' || view !== 'story') return;
    if (!reqOk(c.req)) return;
    sfx('choose');
    var deltas = applyFx(c.fx);
    applyFlags(c.flag);
    applyCnt(c.cnt);
    updateHud();
    view = 'result';
    pendingNext = c.next || nodeNext(current);
    if (c.ending) pendingNext = '__end:' + c.ending;
    if (S.stats.sanity <= 0) pendingNext = '__burnout';
    if (pendingNext && pendingNext.charAt(0) !== '_') S.node = pendingNext;
    save();

    var who = c.rw || 'narrator';
    setSpeaker(who === 'narrator' ? 'narrator' : who);
    if (!current.chat) renderPortrait(who, c.re || (who === 'narrator' ? 'tired' : 'normal'));
    clearChoices();
    pickedEl.innerHTML = '你选择了 · <b>' + esc(c.label) + '</b>';
    pickedEl.classList.remove('hidden');
    renderDeltas(deltas);
    textEl.textContent = '';
    typeText(c.result || '', function () {
      if (view !== 'result') return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'continue-btn';
      btn.textContent = pendingNext && pendingNext.indexOf('__end') === 0 ? '继续 ▸' : '继续 ▸';
      btn.addEventListener('click', function (e) { e.stopPropagation(); continueResult(); });
      choicesEl.appendChild(btn);
      showHint('点击继续 ▾');
    });
  }

  function continueResult() {
    if (mode !== 'play' || view !== 'result') return;
    if (typing) { finishTyping(); return; }
    var nx = pendingNext;
    pendingNext = null;
    if (!nx) { nx = nodeNext(current); }
    if (!nx) return;
    goto(nx);
  }

  function advance() {
    if (mode !== 'play') return;
    if (cardActive) { hideChapterCard(); return; }
    if (typing) { finishTyping(); return; }
    if (view === 'result') { continueResult(); return; }
    if (!current) return;
    if (current.choices && current.choices.length) return;
    if (current.ending) { endGame(computeEnding()); return; }
    var nx = nodeNext(current);
    if (nx) {
      if (nx.indexOf('__end:') === 0) endGame(nx.slice(6));
      else goto(nx);
    }
  }

  /* ============================================================
   * 结局
   * ============================================================ */
  function computeEnding() {
    var st = S.stats;
    if (S.flags.fakeCaught) return 'fake';
    if (st.sanity <= 0) return 'burnout';
    if (st.progress >= 65 && (S.flags.baldPush || (S.cnt.late >= 7 && st.hair <= 60))) return 'bald';
    if (st.progress >= 86 && st.favor >= 72 && st.sanity >= 25) return 'star';
    if (st.progress >= 78 && st.favor >= 55 && st.sanity >= 25) return 'excellent';
    if (st.progress >= 64) return 'smooth';
    if (st.progress >= 52) return 'scrape';
    if (st.progress >= 38) return 'delay';
    return 'dropout';
  }

  function endGame(id) {
    var e = ENDINGS[id] || ENDINGS.smooth;
    mode = 'ending';
    phase = (id === 'fake' || id === 'burnout' || id === 'dropout') ? 'lost' : 'won';
    unlockEnding(id);
    shell.classList.add('covered');
    sfx('ending');
    clearSave();
    renderEnding(id, e);
    postState();
  }

  function endingStatsHTML() {
    var html = '<div class="ending-stats">';
    ['progress', 'favor', 'sanity', 'hair'].forEach(function (k) {
      var v = Math.round(S.stats[k]);
      var color = { progress: '#4fd1c5', favor: '#f0b35b', sanity: '#8bd17c', hair: '#ef8fa8' }[k];
      html += '<div class="es-row"><span class="n">' + STAT_SHORT[k] + '</span><span class="b"><i style="width:' + clamp(v, 0, MAX) + '%;background:' + color + '"></i></span><span class="v">' + v + '</span></div>';
    });
    html += '</div>';
    return html;
  }
  function endingCountersHTML() {
    var items = [];
    if (S.cnt.late) items.push('熬夜 ' + S.cnt.late + ' 次');
    if (S.cnt.ai) items.push('让 AI 帮忙 ' + S.cnt.ai + ' 次');
    if (S.cnt.lie) items.push('撒了个小谎 ' + S.cnt.lie + ' 次');
    if (S.flags.aiCaught) items.push('AI 争议 1 次');
    if (!items.length) items.push('平安无事地活到了答辩');
    return '<div class="ending-counters">' + items.map(function (t) { return '<span class="ec">' + esc(t) + '</span>'; }).join('') + '</div>';
  }

  function renderEnding(id, e) {
    currentEndingId = id;
    overlay.classList.add('on');
    overlay.scrollTop = 0;
    var total = Object.keys(ENDINGS).length;
    var paras = (S.route === 'hum' && HUM_ENDINGS_TEXT[id]) ? HUM_ENDINGS_TEXT[id] : e.text;
    var html = '<div class="ending-wrap"><div class="ending-card" style="--rk:' + e.color + '">' +
      '<div class="rank">' + esc(e.rank) + '</div>' +
      (e.tag ? '<div class="ending-tag">' + esc(e.tag) + '</div>' : '') +
      '<h2 class="ending-title">' + esc(e.name) + '</h2>' +
      '<div class="ending-sub">' + esc(e.sub) + '</div>' +
      '<div class="ending-text">' + paras.map(function (p) { return '<p>' + esc(p.replace(/\{late\}/g, String(S.cnt.late))) + '</p>'; }).join('') + '</div>' +
      endingStatsHTML() +
      endingCountersHTML() +
      '<div class="ending-unlock">结局图鉴 ' + unlocked.length + ' / ' + total + '</div>' +
      '<button class="link-btn" id="galleryBtn">查看全部结局 →</button>' +
      '<div class="ending-actions"><button class="big-btn" id="replayBtn">再来一局</button><button class="big-btn ghost" id="titleBtn">返回标题</button></div>' +
      '</div></div>';
    overlay.innerHTML = html;
    $('replayBtn').addEventListener('click', function (ev) { ev.stopPropagation(); startNew(); });
    $('titleBtn').addEventListener('click', function (ev) { ev.stopPropagation(); showTitle(); });
    $('galleryBtn').addEventListener('click', function (ev) { ev.stopPropagation(); showGallery(); });
    overlay.onclick = null;
  }

  function showGallery() {
    shell.classList.add('covered');
    overlay.classList.add('on');
    overlay.scrollTop = 0;
    overlay.onclick = null;
    var ids = Object.keys(ENDINGS);
    var html = '<div class="gallery"><h2>结局图鉴</h2><div class="g-sub">已解锁 ' + unlocked.length + ' / ' + ids.length + ' · 每一种选择都算数</div><div class="gallery-grid">';
    ids.forEach(function (id) {
      var e = ENDINGS[id];
      var got = unlocked.indexOf(id) >= 0;
      html += '<div class="g-card ' + (got ? '' : 'locked') + '" style="--rk:' + e.color + '">' +
        '<div class="g-rank">' + (got ? esc(e.rank) : '?') + '</div>' +
        '<div class="g-name">' + (got ? esc(e.name) : '？？？') + '</div>' +
        '<div class="g-sub">' + (got ? esc(e.sub) : '还没走到这里') + '</div></div>';
    });
    html += '</div><button class="big-btn ghost g-back" id="galleryBack">返回</button></div>';
    overlay.innerHTML = html;
    $('galleryBack').addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (mode === 'ending') renderEnding(currentEndingId, ENDINGS[currentEndingId]);
      else showTitle();
    });
  }
  var currentEndingId = 'smooth';

  /* ============================================================
   * 标题
   * ============================================================ */
  function showTitle() {
    mode = 'title';
    phase = 'title';
    sceneNow = 'night';
    shell.classList.add('covered');
    overlay.classList.add('on');
    overlay.scrollTop = 0;
    var words = ['已读不回', '创新点？', '延毕', '查重 2.8%', 'AI 率 97%', '盲审', '组会', '发量 -1', '收到', '在吗', '降重', '新文件夹'];
    var wordHtml = words.map(function (w, i) {
      return '<span class="tw" style="left:' + (5 + rnd(i) * 82) + '%;top:' + (8 + rnd(i + 30) * 78) + '%;animation-duration:' + (10 + rnd(i + 7) * 9) + 's;animation-delay:-' + (rnd(i + 3) * 10) + 's;font-size:' + (10 + Math.round(rnd(i + 11) * 4)) + 'px">' + w + '</span>';
    }).join('');
    var sv = loadSave();
    var contLabel = '';
    if (sv) {
      var chKey = sv.chapter || (sv.route === 'hum' ? 'hch0' : 'ch0');
      var c = CHAPTERS[chKey] || CHAPTERS.ch0;
      contLabel = '继续 · ' + (sv.route === 'hum' ? '人文社科' : '理工科') + ' · ' + c.num + ' ' + c.name;
    }
    var total = Object.keys(ENDINGS).length;
    overlay.innerHTML =
      '<div class="title-screen">' +
        '<div class="title-words">' + wordHtml + '</div>' +
        '<div class="title-doc"><i></i><i></i><i></i><i></i><div class="stamp">待修改</div></div>' +
        '<div class="seal">求<br>生</div>' +
        '<div class="title-top">' +
          '<div class="title-kicker">A GRADUATE STORY · 2026</div>' +
          '<h1 class="title">论文求生</h1>' +
          '<div class="title-sub">从开题到答辩</div>' +
          '<div class="title-quote">科研就像在黑暗里洗衣服。<br>灯亮的时候，你得穿着它去答辩。</div>' +
        '</div>' +
        '<div class="title-bottom">' +
          '<div class="route-label">选择你的研究生宇宙</div>' +
          '<div class="route-row">' +
            '<button class="route-btn stem" id="routeStem"><span class="r-ic">理</span><span class="r-tx"><b>理工科</b><small>实验室 · 数据 · 顶会</small></span><span class="r-arrow">→</span></button>' +
            '<button class="route-btn hum" id="routeHum"><span class="r-ic">文</span><span class="r-tx"><b>人文社科</b><small>田野 · 访谈 · C刊</small></span><span class="r-arrow">→</span></button>' +
          '</div>' +
          (contLabel ? '<button class="big-btn ghost" id="contBtn" style="margin-top:9px">' + esc(contLabel) + '</button>' : '') +
          '<div class="title-meta"><button class="meta-link" id="titleGallery">结局图鉴 <b>' + unlocked.length + '</b> / ' + total + '</button><span>两条路线 · 各约 10 分钟</span></div>' +
          '<div class="title-meta" style="justify-content:center;margin-top:9px;color:#5f6b7d">本故事纯属虚构 · 如有雷同，说明我们都在读研</div>' +
        '</div>' +
      '</div>';
    $('routeStem').addEventListener('click', function (e) { e.stopPropagation(); startNew('stem'); });
    $('routeHum').addEventListener('click', function (e) { e.stopPropagation(); startNew('hum'); });
    if (contLabel) $('contBtn').addEventListener('click', function (e) { e.stopPropagation(); continueGame(); });
    $('titleGallery').addEventListener('click', function (e) { e.stopPropagation(); showGallery(); });
    overlay.onclick = null;
    postState();
  }

  function startNew(route) {
    route = route === 'hum' ? 'hum' : 'stem';
    S = newState(route);
    unlocked = loadUnlocked();
    clearSave();
    mode = 'play';
    phase = 'playing';
    shell.classList.remove('covered');
    overlay.classList.remove('on');
    overlay.innerHTML = '';
    overlay.onclick = null;
    currentEndingId = 'smooth';
    hideChapterCard();
    goto(S.node);
  }

  function continueGame() {
    var sv = loadSave();
    if (!sv) { startNew('stem'); return; }
    var route = sv.route === 'hum' ? 'hum' : 'stem';
    S = {
      route: route, node: sv.node, stats: sv.stats || newState(route).stats, flags: sv.flags || {},
      cnt: sv.cnt || { late: 0, ai: 0, lie: 0 }, day: sv.day || 1, chapter: sv.chapter || ''
    };
    mode = 'play';
    phase = 'playing';
    shell.classList.remove('covered');
    overlay.classList.remove('on');
    overlay.innerHTML = '';
    overlay.onclick = null;
    goto(S.node);
  }

  /* ============================================================
   * 交互
   * ============================================================ */
  var dialogEl = $('dialog');
  dialogEl.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    if (e.target.closest('#text') || e.target === dialogEl) advance();
  });
  textEl.addEventListener('click', function (e) { e.stopPropagation(); advance(); });

  document.addEventListener('keydown', function (e) {
    if (mode === 'title') {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startNew('stem');
      }
      return;
    }
    if (mode === 'ending') return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (view === 'story' && current && current.choices && current.choices.length && !typing) {
        var first = choicesEl.querySelector('.choice:not(.locked)');
        if (first) first.click();
      } else advance();
    } else if (/^[1-4]$/.test(e.key)) {
      var idx = parseInt(e.key, 10) - 1;
      var btns = choicesEl.querySelectorAll('.choice:not(.locked)');
      if (btns[idx]) btns[idx].click();
    }
  });

  $('muteBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    this.classList.toggle('off', muted);
    if (!muted) sfx('tap');
    try { localStorage.setItem('lunwen-vn-muted', muted ? '1' : '0'); } catch (err) {}
  });
  try { muted = localStorage.getItem('lunwen-vn-muted') === '1'; } catch (e) {}
  if (muted) $('muteBtn').classList.add('off');

  document.addEventListener('pointerdown', function () { initAudio(); }, { passive: true });

  chapterCard.addEventListener('click', function (e) { e.stopPropagation(); hideChapterCard(); });

  window.addEventListener('resize', resizeAll);

  /* ============================================================
   * 调试 / 工作室接口
   * ============================================================ */
  var fps = 60, fpsFrames = 0, fpsAccum = 0, lastTs = 0;

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    sceneT += dt;
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) { fps = Math.round(fpsFrames / fpsAccum); fpsFrames = 0; fpsAccum = 0; }
    drawBg();
  }

  function postState() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'state', phase: phase, score: Math.round(S.stats.progress) }, '*');
      }
    } catch (e) {}
  }

  function postError(msg) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'error', message: String(msg).slice(0, 300) }, '*');
      }
    } catch (e) {}
  }

  function renderSlots(size) {
    size = size || 256;
    var out = {};
    ['hero', 'advisor', 'senior', 'junior'].forEach(function (key) {
      if (!SLOTS[key] || hasCustomArt(key)) return;
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var g = c.getContext('2d');
      g.translate(size / 2, size / 2);
      drawCharacter(g, key, size * 0.86, 'normal');
      out[key] = c.toDataURL('image/png');
    });
    return out;
  }
  window.__renderSlots = renderSlots;

  window.__gameState = function () {
    return {
      phase: phase,
      score: Math.round(S.stats.progress),
      hearts: Math.max(0, Math.ceil(S.stats.sanity / 25)),
      fps: fps,
      hero: { x: 195, y: 400 },
      pickups: [],
      enemies: [],
      world: { w: 390, h: 844 },
      route: S.route,
      chapter: S.chapter,
      node: S.node,
      stats: { progress: S.stats.progress, favor: S.stats.favor, sanity: S.stats.sanity, hair: S.stats.hair }
    };
  };

  window.__autoplay = function () {
    if (mode === 'title') { startNew('stem'); return; }
    if (mode === 'ending') return;
    if (cardActive) { hideChapterCard(); return; }
    if (typing) { finishTyping(); return; }
    if (view === 'result') { continueResult(); return; }
    if (mode === 'play' && current) {
      if (current.choices && current.choices.length) {
        var c = autoPick(current);
        if (c) choose(c);
      } else {
        advance();
      }
    }
  };

  function autoPick(n) {
    var best = null, bestScore = -1e9;
    n.choices.forEach(function (c) {
      if (!reqOk(c.req)) return;
      var sc = 0;
      if (c.fx) {
        sc += (c.fx.progress || 0) * 2.4 + (c.fx.favor || 0) * 1.4 + (c.fx.sanity || 0) * 1.1 + (c.fx.hair || 0) * 0.35;
      }
      if (c.flag && (c.flag.fakeData || c.flag.fakeCaught || c.flag.aiCaught)) sc -= 800;
      if (c.flag && c.flag.baldPush) sc -= 40;
      if (c.ending) sc -= 2000;
      if (c.tag === '作死' || c.tag === '危险' || c.tag === '摆烂') sc -= 6;
      if (!best || sc > bestScore) { best = c; bestScore = sc; }
    });
    return best || n.choices[0];
  }

  window.addEventListener('error', function (e) { postError(e && e.message ? e.message : 'Unknown error'); });
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e && e.reason && e.reason.message) ? e.reason.message : String(e && e.reason);
    postError(m);
  });

  /* ============================================================
   * 启动
   * ============================================================ */
  preload();
  updateHud();
  resizeAll();
  showTitle();
  requestAnimationFrame(loop);

  setTimeout(function () {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dsh-game-studio', type: 'renders', renders: renderSlots(256) }, '*');
      }
    } catch (e) { postError('character renders failed: ' + (e && e.message || e)); }
  }, 500);
})();
</script>
</body></html>
